[program:zhihua-service]
directory=/root/zhihua-service
command=/bin/bash -lc "set -a; . /root/zhihua-service/.env; set +a; exec /root/zhihua-service/.venv/bin/python -m uvicorn zhihua_service.main:app --host 127.0.0.1 --port 8000"
priority=20
numprocs=1
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/var/log/zhihua-service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
